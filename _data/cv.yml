    PhD student at USC working with Payam Piray on how the brain builds flexible,
    general representations of the world, combining reinforcement learning,
    control theory, Bayesian probability and theoretical neuroscience. Previously
    a research engineer at Honda Research Institute working on representation
    learning for self-driving cars.

